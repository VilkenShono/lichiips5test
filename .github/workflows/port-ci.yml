name: Port CI

# Bring-up builds of the Lichii port. A push to a ci/* branch (or a manual run) builds the release
# ZIP the way release.yml does, and always publishes the build's logs to the ci-logs branch, so
# they can be read with plain git (git fetch origin ci-logs). The ZIP is kept as a 7-day artifact.
# Nothing is released or attested here: release.yml stays the way to make a release.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

# Writing the ci-logs branch.
permissions:
  contents: write

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: port-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 4G
    steps:
      - name: Free disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Locate the caches and the log folder
        run: |
          cache_root=$(dirname "$GITHUB_WORKSPACE")/ci-cache
          mkdir -p "$cache_root" "$RUNNER_TEMP/ci-log"
          {
            echo "CACHE_ROOT=$cache_root"
            echo "RADV_NATIVE=$(dirname "$GITHUB_WORKSPACE")/mihawk-vulkan-review/.deps/native"
            echo "EGLANTINEPS5_DEPS_CACHE=$cache_root/downloads"
            echo "CCACHE_DIR=$cache_root/ccache"
            echo "XDG_CACHE_HOME=$cache_root/xdg"
            echo "JOBS=$(nproc)"
            echo "RADV_BUILD_JOBS=$(nproc)"
            echo "SPIRV_TRANSLATOR=$cache_root/spirv-llvm-translator"
            echo "CI_LOG=$RUNNER_TEMP/ci-log"
          } >> "$GITHUB_ENV"

      - name: Restore the SPIR-V LLVM translator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.SPIRV_TRANSLATOR }}
          key: spirv-llvm-translator-${{ hashFiles('tools/ci/setup-ubuntu-24.04.sh', 'tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Install the build tools (tools/ci/setup-ubuntu-24.04.sh)
        id: tools
        run: |
          bash tools/ci/setup-ubuntu-24.04.sh "$SPIRV_TRANSLATOR" 3>> "$GITHUB_ENV" 2>&1 | tee "$CI_LOG/10-tools.log"
          make toolchain 2>&1 | tee -a "$CI_LOG/10-tools.log"

      - name: Restore downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/downloads
          key: downloads-${{ hashFiles('tools/deps.json') }}

      - name: Fetch dependencies
        id: deps
        run: make deps 2>&1 | tee "$CI_LOG/20-deps.log"

      - name: Restore the RADV driver
        id: radv
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.RADV_NATIVE }}/radv-release
            ${{ env.RADV_NATIVE }}/ps5-payload-sdk
            ${{ env.RADV_NATIVE }}/zlib
            build/radv-isolated
          key: radv-3-${{ hashFiles('tools/deps.json', 'tools/patch-radv-wsi.py', 'tools/build-radv-dependencies.sh', 'tools/isolate-radv.py', 'tools/ci/ubuntu-24.04-packages.txt', 'tools/ci/setup-ubuntu-24.04.sh') }}

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/ccache
          key: ccache-u24-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-u24-

      - name: Build and package
        id: build
        timeout-minutes: 315
        run: |
          ccache --zero-stats
          bash tools/ci/build-release.sh 2>&1 | tee "$CI_LOG/30-build.log"

      - name: Report disk and ccache
        if: always()
        run: |
          {
            df -h "$GITHUB_WORKSPACE"
            ccache --show-stats || true
            ls -la dist 2>/dev/null || true
          } 2>&1 | tee "$CI_LOG/40-report.log"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/ccache
          key: ccache-u24-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the RADV driver
        if: always() && steps.radv.outputs.cache-hit != 'true' && hashFiles('build/radv-isolated/libvulkan_radeon.ps5.a') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.RADV_NATIVE }}/radv-release
            ${{ env.RADV_NATIVE }}/ps5-payload-sdk
            ${{ env.RADV_NATIVE }}/zlib
            build/radv-isolated
          key: radv-3-${{ hashFiles('tools/deps.json', 'tools/patch-radv-wsi.py', 'tools/build-radv-dependencies.sh', 'tools/isolate-radv.py', 'tools/ci/ubuntu-24.04-packages.txt', 'tools/ci/setup-ubuntu-24.04.sh') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outcome == 'success'
        with:
          name: ps5-app-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # The logs go to the ci-logs branch (one commit, replaced by each run): status.txt says how
      # the run ended, *.errors.txt hold the lines around every error, *.log the whole output.
      - name: Publish the logs to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          mkdir -p "$CI_LOG"
          cd "$CI_LOG"
          {
            echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "url: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "tools: $TOOLS_OUTCOME"
            echo "deps: $DEPS_OUTCOME"
            echo "build: $BUILD_OUTCOME"
            echo "finished: $(date -u +%FT%TZ)"
          } > status.txt
          for log in *.log; do
            [[ -f $log ]] || continue
            grep -n -B3 -A14 -E '(error:|FAILED:|fatal:|CMake Error|RuntimeError|Traceback|AssertionError|undefined (symbol|reference)|No such file|does not apply|anchor)' "$log" \
              | cut -c1-600 | head -c 3000000 > "${log%.log}.errors.txt" || true
            if (( $(stat -c %s "$log") > 15000000 )); then
              tail -c 15000000 "$log" > "$log.tail" && mv "$log.tail" "$log"
            fi
          done
          git init -q -b ci-logs .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs: run $GITHUB_RUN_ID, ${GITHUB_SHA:0:10} on ${GITHUB_REF_NAME} (build: $BUILD_OUTCOME)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs
